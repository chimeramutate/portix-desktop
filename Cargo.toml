[package]
name = "portix-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "portix"
path = "src/main.rs"

[dependencies]
# All UI comes from the portix-ui kit; its gpui is reached as `portix_ui::gpui`.
portix-ui = { git = "https://github.com/chimeramutate/portix-ui", rev = "0879a2b355b9a3238e2e58eeb78a06e23cdf0439" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
